name: forge-self-factory

artifactStorePath: .forge/artifact-store.yaml

build:
  # This repo builds no binary. It owns the workspace files, and `forge
  # clone` places them: one command that stands a workspace up from the
  # factory URL, with no working directory to get wrong.
  - name: noop
    src: .
    engine: forge://generic-builder
    spec:
      command: "true"

  # git-lfs rides the image beside the forge tools. ci-state-git grew
  # spec.lfs - kinds whose payloads ride git LFS, the dependency-lock
  # records being the intended first user - and the engine fails loud
  # naming git-lfs when the runner lacks it. container-build-simple has no
  # RUN step, so the binary arrives the way every tool does: as a built
  # artifact the image layer globs. Pure Go, CGO off, so it is static like
  # the rest of the layer.
  #
  # The version is pinned here verbatim, like this factory's other pins:
  # forge-self declares no dependencies block, so nothing resolves from a
  # register. go install lands a cross build under GOPATH/bin/<os>_<arch>
  # and a native one directly in GOPATH/bin, so the copy tries both.
  - name: git-lfs
    src: .
    dest: ./build/bin
    engine: forge://generic-builder
    # One entry, every platform the image ships: generic-builder runs the
    # command once per declared platform with FORGE_OS and FORGE_ARCH set,
    # and records one binary per platform. A cross build lands as
    # build/bin/git-lfs_<os>_<arch>, which is the file the record points at;
    # the image reads the record and never the name.
    platforms: [linux/amd64, linux/arm64]
    spec:
      command: sh
      args:
        - "-c"
        - >-
          GOOS="$FORGE_OS" GOARCH="$FORGE_ARCH" CGO_ENABLED=0
          go install github.com/git-lfs/git-lfs/v3@v3.8.0 &&
          p="$(go env GOPATH)/bin/${FORGE_OS}_${FORGE_ARCH}/git-lfs" &&
          { [ -f "$p" ] || p="$(go env GOPATH)/bin/git-lfs"; } &&
          out="build/bin/git-lfs_${FORGE_OS}_${FORGE_ARCH}" &&
          { [ "$FORGE_PLATFORM" != "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" ] || out="build/bin/git-lfs"; } &&
          install -D -m 0755 "$p" "$out"

  # The toolchain image: every command the members cross-built, on a base,
  # so a CI job runs the toolchain instead of building it. That is what
  # deletes the toolchainScript, and with it the `cd forge` that failed
  # eight scheduled runs in a row.
  #
  # It is built HERE because this is where the whole workspace is visible.
  # No Containerfile and no daemon: there is not one RUN step in it, so it
  # is layer assembly, and multi-architecture costs one layer set per
  # architecture plus an index.
  - name: toolchain
    src: .
    dest: ./build/images
    engine: forge://container-build-simple
    # The platforms assembled, one manifest each in the index: the same
    # declaration every build entry carries.
    platforms: [linux/amd64, linux/arm64]
    spec:
      # glibc, a real shell, and git.
      #
      # The binaries are CGO_ENABLED=0 and would run on scratch, so the first
      # reading of this was that the base exists only for the runner: musl
      # breaks JavaScript actions in edge cases and every `uses:` step is
      # one, and alpine job containers are x64 only, which would silently
      # drop the arm64 half. All true, and all beside the point.
      #
      # The toolchain SHELLS OUT. gitadapter runs git for every revision,
      # every state commit and every tag, and the generated checkout step
      # runs `git config` before anything else. debian:stable-slim ships no
      # git, so a job in it died on `git: not found`, exit 127, before the
      # workspace existed. The -scm variant is the same Debian with git,
      # curl and ssh.
      #
      # Full buildpack-deps because the factory-provisioned runtimes declare
      # a c-compiler prerequisite (go's cgo under `go test -race`, rust's
      # cc-as-linker-driver) that the factory verifies on the base and never
      # installs into it. The recorded first choice - zig from the store as
      # the provider - is unsourceable through this fleet's egress (no
      # sha256-published mirror reachable), so the base carries gcc, which
      # is exactly what full buildpack-deps exists to add over -scm.
      base: buildpack-deps:stable
      binDir: /usr/local/bin
      # What goes into the layer, by record: each entry is a member
      # repository, and every binary its artifact store carries for one of
      # the platforms above lands on that platform under its artifact name.
      # This factory is first, for git-lfs. Nothing is parsed out of a file
      # name, and a member that recorded nothing for a platform fails the
      # build loud rather than an image quietly missing a tool.
      from:
        - "."
        - "../forge"
        - "../forge-ci"
        - "../forge-factory"
        - "../forge-register"
      labels:
        org.opencontainers.image.source: https://github.com/alexandremahdhaoui/forge-self-factory
        org.opencontainers.image.description: The forge toolchain. Every command, on debian.
        org.opencontainers.image.licenses: Apache-2.0

test:
  - name: factory
    runner: forge://generic-test-runner
    spec:
      command: sh
      args: ["hack/factory-check.sh"]

  # The image is built by a test stage for the same reason the binaries are:
  # a pipeline target names a forge stage, and the stage is what the
  # substage fans out to.
  #
  # It builds every artifact, not `toolchain` alone: the image's from:
  # reads this repo's own records, and naming one artifact skipped the
  # git-lfs entry that feeds it - run 641e4ae6d312 died on "a from glob
  # matched nothing" exactly that way.
  - name: build-container
    runner: forge://generic-test-runner
    spec:
      command: forge
      args: ["build"]
