# What the forge-self workspace is made of.
#
# The toolchain lives under its own factory, so the model has no exceptions:
# every forge and forge-* runnable declares this factory, and
# forge-self-register carries the internal track each member resolves from.
#
# Every member keeps its go.mod and go.sum committed. No member declares a
# language, so sync generates no manifest here and the committed files
# stand.
version: "1"
name: forge-self

repos:
  - name: forge
    url: git@github.com:alexandremahdhaoui/forge.git

  - name: forge-ci
    url: git@github.com:alexandremahdhaoui/forge-ci.git

  - name: forge-factory
    url: git@github.com:alexandremahdhaoui/forge-factory.git

  - name: forge-register
    url: git@github.com:alexandremahdhaoui/forge-register.git

  - name: forge-ci-spec
    url: git@github.com:alexandremahdhaoui/forge-ci-spec.git

  - name: forge-revision-spec
    url: git@github.com:alexandremahdhaoui/forge-revision-spec.git

  - name: forge-register-spec
    url: git@github.com:alexandremahdhaoui/forge-register-spec.git

  - name: forge-self-factory
    url: git@github.com:alexandremahdhaoui/forge-self-factory.git

  # The register instance. Its own pipeline writes it and nothing is
  # generated into it.
  - name: forge-self-register
    url: git@github.com:alexandremahdhaoui/forge-self-register.git

  # Where the pipeline records revisions and runs.
  - name: forge-self-state
    url: git@github.com:alexandremahdhaoui/forge-self-state.git

register:
  url: git@github.com:alexandremahdhaoui/forge-self-register.git

engines:
  - alias: go
    engine: forge://github.com/alexandremahdhaoui/forge-factory/cmd/factory-lang-go

  # The default fetch and install engines, and the archive provider that
  # serves uv: forge-register's unread-fields gate runs its checker under
  # `uv run`, and the image carries no uv (run 89). Declared exactly as
  # golden declares them.
  - alias: fetch
    engine: forge://github.com/alexandremahdhaoui/forge-factory/cmd/factory-fetch
  - alias: install
    engine: forge://github.com/alexandremahdhaoui/forge-factory/cmd/factory-install
  - alias: uv
    engine: forge://github.com/alexandremahdhaoui/forge-factory/cmd/factory-runtime-archive

# The container the pipeline's jobs run in, resolved from this factory's
# own register like golden resolves it from theirs. Sync writes the full
# reference into the generated .forge/toolchain-image and the pipeline
# reads it there; the version is typed nowhere. The image supplies `forge`
# for the first clone and nothing else the pipeline relies on: every real
# step runs the four binaries built from the checked-out members, which is
# the code under test.
#
# This pipeline writes the register the pin comes from, so a bad image is
# a bad pin in its own catalog. Recovery is one edit to
# index/internal/ghcr.io/alexandremahdhaoui/forge/0.json in
# forge-self-register, never a rebuild from the proxy.
toolchain:
  image:
    ref: ghcr.io/alexandremahdhaoui/forge
    track: internal:ghcr.io/alexandremahdhaoui/forge

  # What the members' own test-alls need beyond the four toolchain
  # binaries: every repo's build regenerates its mocks, and the lint
  # stages want the linter the repos are clean under. Literal pins, the
  # same versions golden adopted from its register, because this register
  # carries no go tracks yet (see FOLLOWUP); sync builds each once into
  # the store with the go that setup-go put on PATH.
  binaries:
    - name: mockery
      module: github.com/vektra/mockery/v3
      version: v3.7.3
    - name: golangci-lint
      module: github.com/golangci/golangci-lint/v2/cmd/golangci-lint
      version: v2.13.1

  # What a member's own gates need beyond Go: forge-register's
  # unread-fields walks its captured records under `uv run`. The version
  # golden adopted; provisioned into the store on the first clone.
  runtimes:
    uv: { version: "0.8.17" }

state:
  engine: forge://github.com/alexandremahdhaoui/forge-ci/cmd/ci-state-git
  spec:
    path: ./forge-self-state
