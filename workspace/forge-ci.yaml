name: forge-self

artifactStorePath: .forge-ci-self/artifact-store.yaml

# Every toolchain member is listed so a minted revision pins each member's
# sha. The publish step in forge-self-register reads that record: it is what
# lets a remote run resolve a member with no version typed.
repos:
  - name: forge
    url: git@github.com:alexandremahdhaoui/forge.git
    ref: main
  - name: forge-ci
    url: git@github.com:alexandremahdhaoui/forge-ci.git
    ref: main
  - name: forge-factory
    url: git@github.com:alexandremahdhaoui/forge-factory.git
    ref: main
  - name: forge-register
    url: git@github.com:alexandremahdhaoui/forge-register.git
    ref: main
  - name: forge-ci-spec
    url: git@github.com:alexandremahdhaoui/forge-ci-spec.git
    ref: main
  - name: forge-revision-spec
    url: git@github.com:alexandremahdhaoui/forge-revision-spec.git
    ref: main
  - name: forge-register-spec
    url: git@github.com:alexandremahdhaoui/forge-register-spec.git
    ref: main
  # The register the publish stage writes. Its index commits ride the state
  # engine, so the tree stays clean and the loop settles.
  - name: forge-self-register
    url: git@github.com:alexandremahdhaoui/forge-self-register.git
    ref: main
  # The factory itself: the aggregated dist release is created here, and a
  # minted revision pins the workspace files too.
  - name: forge-self-factory
    url: git@github.com:alexandremahdhaoui/forge-self-factory.git
    ref: main

managers:
  - alias: local
    engine: "forge://github.com/alexandremahdhaoui/forge-ci/cmd/ci-manager-local"
    spec:
      statePath: .forge-ci-self/manager-local.json

  # Realizes the GitHub surface the actions engine declares: converged
  # workflow files on this checkout, sealed Actions secrets, workflow
  # enablement. It reads GITHUB_TOKEN from the environment (.envrc).
  - alias: github
    engine: "forge://github.com/alexandremahdhaoui/forge-ci/cmd/ci-manager-github"
    spec:
      statePath: .forge-ci-self/manager-github.json
      tokenEnv: FORGE_CI_GITHUB_TOKEN

engines:
  - alias: here
    type: compute
    engine: "forge://github.com/alexandremahdhaoui/forge-ci/cmd/ci-compute-local"
    manager: local

  # The GitHub surface. This workspace had none for its whole life: the
  # toolchain's own pipeline ran only when somebody typed forge-ci apply on
  # a laptop, while the golden workspace next door has run on a schedule and
  # on member pushes since it was set up. Nothing said so, because an absent
  # engine looks exactly like a working one.
  #
  # Bootstrap provisions the lot; every apply re-converges it, so a
  # hand-edited workflow drifts back to this spec.
  #
  # The jobs run in the published toolchain image, resolved from this
  # factory's own register into .forge/toolchain-image by sync, the same
  # way golden's are. The image supplies `forge` for the first clone and
  # nothing else this pipeline relies on: setup-go and the toolchain script
  # stay, because every real step must run the four binaries built from the
  # checked-out members - that is the code under test. The seed this
  # replaced, `go run <module>@<version> bootstrap`, looked up the module's
  # @latest to report deprecation and found the tag release-artifacts had
  # cut eleven seconds earlier in the same run, which the sum database had
  # not indexed (run 66). No `@version` here means no lookup and no proxy.
  - alias: actions
    type: compute
    engine: "forge://github.com/alexandremahdhaoui/forge-ci/cmd/ci-compute-github"
    manager: github
    spec:
      repo: alexandremahdhaoui/forge-self-factory
      dir: forge-self-factory
      containerFile: .forge/toolchain-image
      setup:
        - uses: actions/setup-go@v7
          with:
            go-version: "1.26"
      workspace:
        # A container carries tools and not members, so this is what puts
        # the repos on disk. forge is already on PATH inside the image.
        bootstrapCommand: forge clone git@github.com:alexandremahdhaoui/forge-self-factory.git .
        toolchainScript: |
          (cd forge && go install ./cmd/forge)
          (cd forge-factory && go install ./cmd/...)
          (cd forge-ci && go install ./cmd/...)
          (cd forge-register && go install ./cmd/...)
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          # forge's own suites run forge's engines from this checkout, the
          # way forge's .envrc has every developer run them: a checkout's
          # forge is labelled by git describe, and an engine resolved by
          # that label through the proxy is a version that does not exist
          # (run 93). Run-local resolves forge://<engine> to `go run
          # ./cmd/<engine>` here, so every member tests the engines of the
          # commit under test, not the image's.
          echo "FORGE_RUN_LOCAL_ENABLED=true" >> "$GITHUB_ENV"
          echo "FORGE_RUN_LOCAL_BASEDIR=$PWD/forge" >> "$GITHUB_ENV"
        # What the script installs, cached across the jobs of a run under
        # the members' shas: five jobs compile the toolchain once.
        toolchainCachePaths: ["~/go/bin", "~/.cache/go-build"]
      # One apply as jobs: self-reconcile, evaluate, then one per stage.
      # A stage's job runs its substages in the waves their `needs:` declare
      # and asks the promotion itself; the job of the stage after waits on
      # it. What a stage built crosses to the stages after it as an Actions
      # artifact: the image layout the build stage assembles is what the
      # release stage pushes. Five jobs a run, and a failure shows the stage
      # it happened in.
      phases: true
      jobs: stage
      secrets:
        # Reads every toolchain member and pushes the state repo; the
        # release step needs contents:write on each member it tags.
        - name: FORGE_CI_GITHUB_TOKEN
          fromEnv: FORGE_CI_GITHUB_TOKEN
      workflows:
        - name: ci
          kind: command
          header: |
            # The toolchain's own pipeline. It stands the workspace up, gates
            # every member's suites, mints a revision pinning each sha,
            # publishes each member into forge-self-register's internal track
            # with that revision as provenance, and releases the aggregated
            # distribution.
            #
            # member-pushed is the trigger a toolchain repo sends on push, so
            # this costs nothing while nobody is pushing.
          events: [member-pushed]
          # A settle's own push must fire the superseding run, exactly as
          # golden's does: without this, a regenerated workflow waited for
          # the next member push to take effect.
          pushBranches: [main]
          # A dispatched or scheduled run has no audience here: whoever caused
          # it is watching another repo's checks, or nobody typed it at all.
          reportFailure: true
          job: apply
          stepName: Run the toolchain pipeline
          secret: FORGE_CI_GITHUB_TOKEN
          # Each release engine names its credential in its own spec. The
          # binary release uses the PAT; the image push uses the per-run
          # Actions token, because GHCR takes only that token or a classic
          # PAT with write:packages, and the PAT here is fine-grained. token
          # puts secrets.GITHUB_TOKEN into the step; packages grants it the
          # registry write.
          token: true
          packages: true
          command: |
            forge-ci apply --config forge-ci.yaml --root .
        - name: release
          kind: release
          # It stands the workspace up to reach the toolchain, and that clone
          # reaches private members.
          secret: FORGE_CI_GITHUB_TOKEN

  - alias: ci-state
    type: state
    engine: "forge://github.com/alexandremahdhaoui/forge-ci/cmd/ci-state-git"
    manager: local
    spec:
      path: forge-self-state

  # The watch list is the one membership statement that matters here: it
  # decides what counts as a move, and it declares the workflow that makes a
  # move visible. Nothing on GitHub starts a workflow in this repo when a
  # member moves, so every watched repo carries a generated notify workflow
  # that sends the dispatch. One list, so the trigger and the notifier can
  # never disagree.
  #
  # The register and the state repo are absent on purpose: this pipeline
  # writes both on every run, so a notify there would never settle.
  - alias: on-change
    type: trigger
    engine: "forge://github.com/alexandremahdhaoui/forge-ci/cmd/ci-trigger-watch"
    manager: github
    spec:
      watch:
        - forge
        - forge-ci
        - forge-factory
        - forge-register
        - forge-ci-spec
        - forge-revision-spec
        - forge-register-spec
      notify:
        owner: alexandremahdhaoui
        factory: forge-self-factory
        eventType: member-pushed
        secret: FORGE_CI_DISPATCH_TOKEN

  - alias: all-pass
    type: promotion
    engine: "forge://github.com/alexandremahdhaoui/forge-ci/cmd/ci-promotion-all"
    manager: local

  # The distribution door, live. It needs GITHUB_TOKEN in the environment
  # and api.github.com reachable. On green it tags EVERY member with the one
  # version the core decided, and creates ONE aggregated release under that
  # same tag in forge-self-factory: every cross-built binary the build
  # recorded, plus index.json pinning each binary's measured sha256 and the
  # revision it was proven from.
  # Consumers point FORGE_DIST_MIRROR (or sync --tooling-from) at
  # https://github.com/alexandremahdhaoui/forge-self-factory/releases/latest/download
  # and the store verifies every byte against the index.
  - alias: release-artifacts
    type: artifact
    engine: "forge://github.com/alexandremahdhaoui/forge-ci/cmd/ci-artifact-release"
    manager: local
    spec:
      repo: alexandremahdhaoui/forge-self-factory
      tokenEnv: FORGE_CI_GITHUB_TOKEN
  # No assets glob: the build stage builds every command whose build entry
  # declares platforms:, each recorded as an artifact named
  # <name>_<os>_<arch>, and the release publishes exactly those records. A
  # repo's own tool declares no platform and never leaves its repo.

  # The image door. It pushes to GHCR with the token Actions injects, so
  # there is no secret to create, seal or rotate - the workflow declares
  # packages: write and that is the whole credential story.
  #
  # No tag is named here: the tag is the version the core decided, so the
  # image and the git tags carry one number. movingTags names conveniences
  # that move on every release and are never something to pin.
  - alias: release-container
    type: artifact
    engine: "forge://github.com/alexandremahdhaoui/forge-ci/cmd/ci-artifact-container"
    manager: local
    spec:
      image: ghcr.io/alexandremahdhaoui/forge
      movingTags: [latest]
      # GHCR accepts the per-run Actions token or a classic PAT with
      # write:packages; a fine-grained PAT has no packages capability, so
      # this engine reads the token the workflow's token: true injects.
      tokenEnv: GITHUB_TOKEN

state: ci-state
triggers: [on-change]

targets:
  # Every stage each member declares, which is what test-all means: build,
  # then lint, the gates, unit, integration, conformance, e2e and coverage,
  # as the repo names them. The pipeline ran unit alone in two of the four
  # repos, so a release shipped executables that no gate had seen.
  - alias: test-all
    forge: test-all
    in: [forge-ci, forge-factory, forge-register]

  # forge's test-all wants a kind cluster (integration) and a container
  # daemon (the container-build entries its `generated` regenerates), and
  # this runner has neither. Every other stage it declares, by name.
  - alias: forge-lint-tags
    forge: test run lint-tags
    in: [forge]
  - alias: forge-lint-license
    forge: test run lint-license
    in: [forge]
  - alias: forge-lint
    forge: test run lint
    in: [forge]
  - alias: forge-unit
    forge: test run unit
    in: [forge]
  - alias: forge-unit-nonroot
    forge: test run unit-nonroot
    in: [forge]
  # forge's e2e runner execs ./build/bin/forge-e2e in two of its cases, and
  # `test run <stage>` builds nothing. One entry, named: the whole build
  # would drag in the two container entries that want a daemon.
  - alias: forge-build-e2e-runner
    forge: build forge-e2e
    in: [forge]
  - alias: forge-e2e
    forge: test run e2e
    in: [forge]
  - alias: forge-e2e-decl
    forge: test run e2e-decl
    in: [forge]
  - alias: forge-e2e-stub
    forge: test run e2e-stub
    in: [forge]
  - alias: forge-e2e-run
    forge: test run e2e-run
    in: [forge]

  - alias: publish-revision
    forge: test run publish-members
    in: [forge-self-register]

  # Cross-build every toolchain command for the distribution: CGO off,
  # linux amd64+arm64, stamped with the revision through FORGE_CI_REVISION.
  - alias: build-artifacts
    forge: test run build-artifacts
    in: [forge, forge-ci, forge-factory, forge-register]

  # Assemble the toolchain image from what build-artifacts cross-built. It
  # runs in the factory because that is the one place the whole workspace is
  # visible.
  - alias: build-container
    forge: test run build-container
    in: [forge-self-factory]

# Test, then build, then release. Stage order separates what must be proven
# from what is published; inside a stage, `needs:` on a substage says what
# it waits on, and substages that name nothing run at the same time. The
# loop stops at the first stage that does not advance, so nothing is packed
# that did not cross-build and nothing is published that did not pack.
#
# The revision is not minted here. The evaluate phase mints it before the
# first stage, because it is the run's identity rather than its verdict, and
# it is what publish-revision hands consumers as provenance.
stages:
  - name: test
    promotion: all-pass
    substages:
      - name: test-all
        engine: here
        manager: local
        # The convergence provisions mockery into the store before anything
        # builds, and a multi-repo pipeline that never syncs is refused by
        # forge-ci validate.
        sync: true
        # Targets run one after another on one disk. forge's stages come
        # after the three test-alls that need nothing of forge's own tree.
        targets:
          - test-all
          - forge-lint-tags
          - forge-lint-license
          - forge-lint
          - forge-unit
          - forge-unit-nonroot
          - forge-build-e2e-runner
          - forge-e2e
          - forge-e2e-decl
          - forge-e2e-stub
          - forge-e2e-run

  # The executables the release ships, then the image built from them:
  # build-container needs build-artifacts, and that edge is the whole
  # ordering.
  - name: build
    promotion: all-pass
    substages:
      - name: build-artifacts
        engine: here
        manager: local
        sync: true
        targets: [build-artifacts]
      - name: build-container
        engine: here
        manager: local
        sync: true
        needs: [build-artifacts]
        targets: [build-container]

  # Three publishes, declared the same way anything else is, in the order
  # their `needs:` declare. Every artifact substage records the release
  # under releases/<revision> and releases/by-tag/<tag>, and two of them
  # writing those files at once is the rebase conflict that killed run 44 -
  # so release-container waits on release-artifacts. publish-revision waits
  # on both: it is the only door into the register's internal track, and it
  # writes the image's version there too, so the catalog can never name a
  # tag nobody cut or an image nobody pushed.
  #
  # release-artifacts is FIRST on purpose: the core reads the first artifact
  # engine in stage then substage order for the repo the version line lives
  # in and for the members the release leaves alone. release-container names
  # no repo - it pushes to a registry and tags nothing - so putting it first
  # would put the version line at the factory root, which is not a repo.
  - name: release
    promotion: all-pass
    substages:
      - name: release-artifacts
        engine: release-artifacts
        manager: local
      - name: release-container
        engine: release-container
        manager: local
        needs: [release-artifacts]
      - name: publish-revision
        engine: here
        manager: local
        needs: [release-container]
        targets: [publish-revision]
