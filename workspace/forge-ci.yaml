name: forge-self

artifactStorePath: .forge-ci-self/artifact-store.yaml

# Every toolchain member is listed so a minted revision pins each member's
# sha. The publish step in forge-self-register reads that record: it is what
# lets a remote run resolve a member with no version typed.
repos:
  - name: forge
    url: git@github.com:alexandremahdhaoui/forge.git
    ref: main
  - name: forge-ci
    url: git@github.com:alexandremahdhaoui/forge-ci.git
    ref: main
  - name: forge-factory
    url: git@github.com:alexandremahdhaoui/forge-factory.git
    ref: main
  - name: forge-register
    url: git@github.com:alexandremahdhaoui/forge-register.git
    ref: main
  - name: forge-ci-spec
    url: git@github.com:alexandremahdhaoui/forge-ci-spec.git
    ref: main
  - name: forge-revision-spec
    url: git@github.com:alexandremahdhaoui/forge-revision-spec.git
    ref: main
  - name: forge-register-spec
    url: git@github.com:alexandremahdhaoui/forge-register-spec.git
    ref: main
  # The register the publish stage writes. Its index commits ride the state
  # engine, so the tree stays clean and the loop settles.
  - name: forge-self-register
    url: git@github.com:alexandremahdhaoui/forge-self-register.git
    ref: main
  # The factory itself: the aggregated dist release is created here, and a
  # minted revision pins the workspace files too.
  - name: forge-self-factory
    url: git@github.com:alexandremahdhaoui/forge-self-factory.git
    ref: main

managers:
  - alias: local
    engine: "forge://github.com/alexandremahdhaoui/forge-ci/cmd/ci-manager-local"
    spec:
      statePath: .forge-ci-self/manager-local.json

engines:
  - alias: here
    type: compute
    engine: "forge://github.com/alexandremahdhaoui/forge-ci/cmd/ci-compute-local"
    manager: local

  - alias: ci-state
    type: state
    engine: "forge://github.com/alexandremahdhaoui/forge-ci/cmd/ci-state-git"
    manager: local
    spec:
      path: forge-self-state

  - alias: on-change
    type: trigger
    engine: "forge://github.com/alexandremahdhaoui/forge-ci/cmd/ci-trigger-watch"
    manager: local
    spec:
      watch: ["forge", "forge-ci", "forge-factory", "forge-register"]

  - alias: all-pass
    type: promotion
    engine: "forge://github.com/alexandremahdhaoui/forge-ci/cmd/ci-promotion-all"
    manager: local

  # The distribution door. Uncomment this engine and the `release: publish`
  # line on the publish stage, with GITHUB_TOKEN exported (repo + contents
  # scope) and api.github.com reachable. On green it tags every member with
  # the next semver and creates ONE aggregated release per revision, tagged
  # dist-<revision> in forge-self-factory: every cross-built binary from
  # build/dist plus index.json pinning each binary's measured sha256.
  # Consumers point FORGE_DIST_MIRROR (or sync --tooling-from) at
  # https://github.com/alexandremahdhaoui/forge-self-factory/releases/latest/download
  # and the store verifies every byte against the index.
  - alias: dist-release
    type: artifact
    engine: "forge://github.com/alexandremahdhaoui/forge-ci/cmd/ci-artifact-release"
    manager: local
    spec:
      releaseIn: forge-self-factory
      assets:
        - "forge/build/dist/*"
        - "forge-ci/build/dist/*"
        - "forge-factory/build/dist/*"
        - "forge-register/build/dist/*"

state: ci-state
triggers: [on-change]

targets:
  - alias: gate
    forge: test run unit
    in: [forge-factory, forge-register]

  - alias: publish-members
    forge: test run publish-members
    in: [forge-self-register]

  # Cross-build every toolchain command for the distribution: CGO off,
  # linux amd64+arm64, stamped with the revision through FORGE_CI_REVISION.
  - alias: build-dist
    forge: test run dist
    in: [forge, forge-ci, forge-factory, forge-register]

stages:
  - name: build
    # The revision is minted here, once the gate passes. The record carries
    # every member's sha, which is what the publish stage hands to
    # consumers as provenance.
    mint: true
    promotion: all-pass
    substages:
      - name: default
        engine: here
        manager: local
        targets: [gate]

  # Publish is the only door into the internal track: each member enters
  # with the minted revision as provenance. The dist substage cross-builds
  # the whole toolchain alongside it, so the binaries the release would
  # carry are proven on every run whether or not the release is active.
  - name: publish
    promotion: all-pass
    release: dist-release
    substages:
      - name: default
        engine: here
        manager: local
        targets: [publish-members]
      - name: dist
        engine: here
        manager: local
        targets: [build-dist]
