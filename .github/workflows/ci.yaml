          key: toolchain-${{ runner.os }}-${{ steps.toolchain-key.outputs.key }}

      - name: Install the toolchain from the workspace
        run: |
          (cd forge && go install ./cmd/forge)
          (cd forge-factory && go install ./cmd/...)
          (cd forge-ci && go install ./cmd/...)
          (cd forge-register && go install ./cmd/...)
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          # forge's own suites run forge's engines from this checkout, the
          # way forge's .envrc has every developer run them: a checkout's
          # forge is labelled by git describe, and an engine resolved by
          # that label through the proxy is a version that does not exist
          # (run 93). Run-local resolves forge://<engine> to `go run
          # ./cmd/<engine>` here, so every member tests the engines of the
          # commit under test, not the image's.
          echo "FORGE_RUN_LOCAL_ENABLED=true" >> "$GITHUB_ENV"
          echo "FORGE_RUN_LOCAL_BASEDIR=$PWD/forge" >> "$GITHUB_ENV"

      - name: Save the toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/go/bin
            ~/.cache/go-build
          key: toolchain-${{ runner.os }}-${{ steps.toolchain-key.outputs.key }}

      - name: Evaluate next steps
        id: phase
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGE_CI_GITHUB_TOKEN: ${{ secrets.FORGE_CI_GITHUB_TOKEN }}
        run: |
          out=$(forge-ci apply --config forge-ci.yaml --root . --phase evaluate)
          printf '%s\n' "$out"
          echo "outcome=$(printf '%s\n' "$out" | sed -n 's/^evaluate: //p' | tail -n 1)" >> "$GITHUB_OUTPUT"
          echo "revision=$(printf '%s\n' "$out" | sed -n 's/^revision //p' | head -n 1)" >> "$GITHUB_OUTPUT"

