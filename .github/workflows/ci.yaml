# The toolchain's own pipeline. It stands the workspace up, gates
# every member's suites, mints a revision pinning each sha,
# publishes each member into forge-self-register's internal track
# with that revision as provenance, and releases the aggregated
# distribution.
#
# member-pushed is the trigger a toolchain repo sends on push, so
# this costs nothing while nobody is pushing.
name: ci

on:
  repository_dispatch:
    types: [member-pushed]
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  packages: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  self-reconcile:
    name: Reconcile CI resources
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/alexandremahdhaoui/forge:v0.45.62
    steps:
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Restore the tool store
        id: tool-store
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/forge
          key: tool-store-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            tool-store-${{ runner.os }}-

      - name: Check out the workspace around this repo
        run: |
          git config --global url."https://x-access-token:${{ secrets.FORGE_CI_GITHUB_TOKEN }}@github.com/".insteadOf "git@github.com:"
          forge clone git@github.com:alexandremahdhaoui/forge-self-factory.git .

      - name: Name the toolchain by the members it is built from
        id: toolchain-key
        run: |
          echo "key=$(for d in */.git; do git -C "${d%/.git}" rev-parse HEAD; done | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore the toolchain
        id: toolchain-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/bin
            ~/.cache/go-build
          key: toolchain-${{ runner.os }}-${{ steps.toolchain-key.outputs.key }}

      - name: Install the toolchain from the workspace
        run: |
          (cd forge && go install ./cmd/forge)
          (cd forge-factory && go install ./cmd/...)
          (cd forge-ci && go install ./cmd/...)
          (cd forge-register && go install ./cmd/...)
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          # forge's own suites run forge's engines from this checkout, the
          # way forge's .envrc has every developer run them: a checkout's
          # forge is labelled by git describe, and an engine resolved by
          # that label through the proxy is a version that does not exist
          # (run 93). Run-local resolves forge://<engine> to `go run
          # ./cmd/<engine>` here, so every member tests the engines of the
          # commit under test, not the image's.
          echo "FORGE_RUN_LOCAL_ENABLED=true" >> "$GITHUB_ENV"
          echo "FORGE_RUN_LOCAL_BASEDIR=$PWD/forge" >> "$GITHUB_ENV"

      - name: Save the toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/go/bin
            ~/.cache/go-build
          key: toolchain-${{ runner.os }}-${{ steps.toolchain-key.outputs.key }}

      - name: Reconcile CI resources
        id: phase
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGE_CI_GITHUB_TOKEN: ${{ secrets.FORGE_CI_GITHUB_TOKEN }}
        run: |
          forge-ci apply --config forge-ci.yaml --root . --phase self-reconcile

      - name: Name the tool store by its content
        id: tool-store-key
        if: always()
        run: |
          echo "key=$(find ~/.cache/forge -mindepth 1 -maxdepth 4 2>/dev/null | sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "present=$([ -d ~/.cache/forge ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Save the tool store
        if: always() && steps.tool-store-key.outputs.present == 'true' && steps.tool-store.outputs.cache-matched-key != format('tool-store-{0}-{1}', runner.os, steps.tool-store-key.outputs.key)
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/forge
          key: tool-store-${{ runner.os }}-${{ steps.tool-store-key.outputs.key }}

      - name: Say that the run failed
        if: failure()
        env:
          TOKEN: ${{ github.token }}
          TITLE: "ci is failing"
        run: |
          open=$(curl -fsS \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100")
          if printf '%s' "$open" | grep -q "\"title\": *\"$TITLE\""; then
            echo "an issue is already open for this; not filing another"
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues" \
            -d "{\"title\":\"$TITLE\",\"body\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID failed. Nothing else reports this run, so it reports itself. Close this once a run goes green; a failure after that files a new one.\"}"
