        uses: actions/cache/save@v6
        with:
          path: |
            ~/go/bin
            ~/.cache/go-build
          key: toolchain-${{ runner.os }}-${{ steps.toolchain-key.outputs.key }}

      - name: Mark what was here before this job ran
        run: |
          mkdir -p .forge-ci/artifacts
          touch .forge-ci/pack-mark

      - name: Run stage test
        id: phase
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGE_CI_GITHUB_TOKEN: ${{ secrets.FORGE_CI_GITHUB_TOKEN }}
        run: |
          forge-ci apply --config forge-ci.yaml --root . --phase stages --stage test --revision ${{ needs.evaluate.outputs.revision }}

      - name: Pack what this job built
        id: pack
        run: |
          if [ -d .forge-ci/artifacts ]; then
            find .forge-ci/artifacts -type f -newer .forge-ci/pack-mark -printf '%P\n' > .forge-ci/pack-list
