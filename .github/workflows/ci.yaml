            ~/.cache/go-build
          key: toolchain-${{ runner.os }}-${{ steps.toolchain-key.outputs.key }}

      - name: Bring back what the jobs before this one built
        uses: actions/download-artifact@v8
        with:
          pattern: built-${{ github.run_id }}-*
          merge-multiple: true
          path: .forge-ci/carried

      - name: Unpack it
        run: |
          mkdir -p .forge-ci/artifacts
          for f in .forge-ci/carried/*.tar.gz; do
            [ -e "$f" ] || continue
            tar -xzf "$f" -C .forge-ci/artifacts
          done

      - name: Mark what was here before this job ran
        run: |
          mkdir -p .forge-ci/artifacts
          touch .forge-ci/pack-mark

      - name: Run stage release
        id: phase
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGE_CI_GITHUB_TOKEN: ${{ secrets.FORGE_CI_GITHUB_TOKEN }}
        run: |
          forge-ci apply --config forge-ci.yaml --root . --phase stages --stage release --revision ${{ needs.evaluate.outputs.revision }}

      - name: Pack what this job built
        id: pack
        run: |
          if [ -d .forge-ci/artifacts ]; then
            find .forge-ci/artifacts -type f -newer .forge-ci/pack-mark -printf '%P\n' > .forge-ci/pack-list
          else
            : > .forge-ci/pack-list
          fi
          if [ -s .forge-ci/pack-list ]; then
            mkdir -p .forge-ci/carried
            tar -czf .forge-ci/carried/built-release.tar.gz -C .forge-ci/artifacts -T .forge-ci/pack-list
            echo packed=true >> "$GITHUB_OUTPUT"
          else
            echo packed=false >> "$GITHUB_OUTPUT"
          fi

      - name: Keep what this job built for the jobs after it
        if: steps.pack.outputs.packed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: built-${{ github.run_id }}-release
          path: .forge-ci/carried/built-release.tar.gz
          retention-days: 7

      - name: Name the tool store by its content
        id: tool-store-key
        if: always()
        run: |
          echo "key=$(find ~/.cache/forge -mindepth 1 -maxdepth 4 2>/dev/null | sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "present=$([ -d ~/.cache/forge ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Save the tool store
        if: always() && steps.tool-store-key.outputs.present == 'true' && steps.tool-store.outputs.cache-matched-key != format('tool-store-{0}-{1}', runner.os, steps.tool-store-key.outputs.key)
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/forge
          key: tool-store-${{ runner.os }}-${{ steps.tool-store-key.outputs.key }}

      - name: Say that the run failed
        if: failure()
        env:
          TOKEN: ${{ github.token }}
          TITLE: "ci is failing"
        run: |
          open=$(curl -fsS \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100")
          if printf '%s' "$open" | grep -q "\"title\": *\"$TITLE\""; then
            echo "an issue is already open for this; not filing another"
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues" \
            -d "{\"title\":\"$TITLE\",\"body\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID failed. Nothing else reports this run, so it reports itself. Close this once a run goes green; a failure after that files a new one.\"}"
