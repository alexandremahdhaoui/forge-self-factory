          FORGE_CI_GITHUB_TOKEN: ${{ secrets.FORGE_CI_GITHUB_TOKEN }}
        run: |
          forge-ci apply --config forge-ci.yaml --root . --phase stages --stage test --substage unit --revision ${{ needs.evaluate.outputs.revision }}

      - name: Pack what this job built
